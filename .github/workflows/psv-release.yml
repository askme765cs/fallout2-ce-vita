name: PS Vita Development Build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build-psv:
    name: PS Vita
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build with VitaSDK Docker
        uses: addnab/docker-run-action@v3
        with:
          image: vitasdk/vitasdk:latest
          options: -v ${{ github.workspace }}:/build/git/sourcedir
          run: |
            export VITASDK=/usr/local/vitasdk
            export PATH="$VITASDK/bin:$PATH"
            cd /build/git/sourcedir
            cmake \
              -B build_vita \
              -Wno-dev \
              -D CMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake \
              -D CMAKE_BUILD_TYPE=None \
              -D CMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -D VITA=ON
            cmake --build build_vita -- -j4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fallout2-ce-vita-vpk
          path: build_vita/fallout2-ce.vpk
          retention-days: 7

      - name: Generate continuous release notes
        if: ${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/vita-cn-port') }}
        run: |
          set -euo pipefail

          git fetch --force origin refs/tags/latest:refs/tags/latest || true
          previous_sha="$(git rev-parse -q --verify refs/tags/latest || true)"
          current_sha="$GITHUB_SHA"

          {
            echo "Continuous Vita CN build from \`${GITHUB_REF_NAME}\` at \`${current_sha}\`."
            echo

            if [[ -n "$previous_sha" && "$previous_sha" != "$current_sha" ]]; then
              echo "Changes since previous continuous release:"
              echo
              git log --pretty=format:'- `%h` %s' "${previous_sha}..${current_sha}" || true
              echo
              echo
              echo "Compare: https://github.com/${GITHUB_REPOSITORY}/compare/${previous_sha}...${current_sha}"
            else
              echo "No new commits since the previous continuous release."
            fi
          } > release-notes.md

      - name: Move continuous release tag
        if: ${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/vita-cn-port') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$GITHUB_SHA"
          git push --force origin refs/tags/latest

      - name: Upload development release
        if: ${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/vita-cn-port') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Fallout2-CE Vita CN Continuous Build
          body_path: release-notes.md
          prerelease: false
          make_latest: true
          files: build_vita/fallout2-ce.vpk

      - name: Upload tagged release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: build_vita/fallout2-ce.vpk
