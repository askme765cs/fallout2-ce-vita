name: PS Vita Development Build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  build-psv:
    name: PS Vita
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Build with VitaSDK Docker
        uses: addnab/docker-run-action@v3
        with:
          image: vitasdk/vitasdk:latest
          options: -v ${{ github.workspace }}:/build/git/sourcedir
          run: |
            export VITASDK=/usr/local/vitasdk
            export PATH="$VITASDK/bin:$PATH"
            cd /build/git/sourcedir
            cmake \
              -B build_vita \
              -Wno-dev \
              -D CMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake \
              -D CMAKE_BUILD_TYPE=None \
              -D CMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -D VITA=ON
            cmake --build build_vita -- -j4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fallout2-ce-vita-vpk
          path: build_vita/fallout2-ce.vpk
          retention-days: 7

      - name: Move continuous release tag
        if: ${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/vita-cn-port') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "$GITHUB_SHA"
          git push --force origin refs/tags/latest

      - name: Upload development release
        if: ${{ github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/') && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/vita-cn-port') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          target_commitish: ${{ github.sha }}
          name: Fallout2-CE Vita CN Continuous Build
          body: |
            Continuous Vita CN build from `${{ github.ref_name }}` at `${{ github.sha }}`.
          prerelease: false
          make_latest: true
          files: build_vita/fallout2-ce.vpk

      - name: Upload tagged release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: build_vita/fallout2-ce.vpk
